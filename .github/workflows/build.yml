name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            include_native_libraries: true
          - os: windows-latest
            rid: win-x64
            include_native_libraries: true
          - os: macos-latest
            rid: osx-x64
            include_native_libraries: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore --runtime ${{ matrix.rid }}

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:UseAppHost=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.include_native_libraries }}
          -p:DebugType=None
          -p:DebugSymbols=false
          --no-restore
          --output ./publish/${{ matrix.rid }}

      - name: Package macOS application
        if: matrix.rid == 'osx-x64'
        shell: bash
        run: |
          APP_BUNDLE="./artifacts/osx-x64/InFamousModManager.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          cp -a "./publish/osx-x64/." "$APP_BUNDLE/Contents/MacOS"
          cat > "$APP_BUNDLE/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>InfamousModManager</string>
            <key>CFBundleIdentifier</key>
            <string>com.mentallyillkid.infamousmodmanager</string>
            <key>CFBundleName</key>
            <string>InFamous Mod Manager</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Upload Windows or Linux artifact
        if: matrix.rid != 'osx-x64'
        uses: actions/upload-artifact@v4
        with:
          name: InFamousModManager-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}
          retention-days: 14

      - name: Upload macOS app bundle
        if: matrix.rid == 'osx-x64'
        uses: actions/upload-artifact@v4
        with:
          name: InFamousModManager-${{ matrix.rid }}
          path: ./artifacts/osx-x64/InFamousModManager.app
          retention-days: 14
